<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Do currículo em PDF ao Career OS</title>
  <desc id="desc">Capa editorial com uma captura real do visualizador Career OS e seu grafo profissional.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.56" stop-color="#0c2038"/>
      <stop offset="1" stop-color="#123a55"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4de1c3"/>
      <stop offset="1" stop-color="#76d9ff"/>
    </linearGradient>
    <linearGradient id="frameStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6edcf4" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#354e71" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#50dfbd" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="frameShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#02060d" flood-opacity="0.68"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="554" y="128" width="666" height="451" rx="0"/>
    </clipPath>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8ecce4" stroke-width="1" opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <circle cx="1140" cy="30" r="330" fill="#286d91" opacity="0.12"/>
  <circle cx="780" cy="750" r="390" fill="#19b99b" opacity="0.075"/>
  <ellipse cx="934" cy="362" rx="360" ry="260" fill="#39d4b4" opacity="0.08" filter="url(#softGlow)"/>

  <g transform="translate(66 67)" font-family="Inter, Arial, sans-serif">
    <rect width="214" height="35" rx="17.5" fill="#34d3b3" opacity="0.13" stroke="#45ddbf" stroke-opacity="0.48"/>
    <text x="107" y="23.5" text-anchor="middle" fill="#67e6cf" font-size="13" font-weight="750" letter-spacing="1.8">PRODUTO REAL + IA</text>

    <text x="0" y="104" fill="#f3f8fc" font-size="52" font-weight="760" letter-spacing="-1.5">
      <tspan x="0">Do currículo</tspan>
      <tspan x="0" dy="62">em PDF ao</tspan>
      <tspan x="0" dy="66" fill="url(#headline)">Career OS</tspan>
    </text>

    <text x="2" y="336" fill="#bed0df" font-size="20" font-weight="400">
      <tspan x="2">Como transformei um documento</tspan>
      <tspan x="2" dy="31">estático em um sistema para</tspan>
      <tspan x="2" dy="31">gerenciar minha trajetória.</tspan>
    </text>

    <g transform="translate(2 471)">
      <line x1="0" y1="0" x2="404" y2="0" stroke="url(#headline)" stroke-width="3"/>
      <text x="0" y="43" fill="#edf5fb" font-size="17" font-weight="720">KEVIN AUGUSTO VIEIRA</text>
      <text x="0" y="72" fill="#87a8c1" font-size="14">Product Manager · GTM · AI Implementation</text>
    </g>
  </g>

  <g filter="url(#frameShadow)">
    <rect x="536" y="88" width="702" height="510" rx="18" fill="#090d17" stroke="url(#frameStroke)" stroke-width="2"/>
    <rect x="537" y="89" width="700" height="40" rx="17" fill="#101827"/>
    <rect x="537" y="112" width="700" height="17" fill="#101827"/>
    <circle cx="561" cy="108" r="5.5" fill="#ff6b69"/>
    <circle cx="579" cy="108" r="5.5" fill="#f2bf4b"/>
    <circle cx="597" cy="108" r="5.5" fill="#42cf78"/>
    <rect x="625" y="98" width="435" height="20" rx="10" fill="#172237"/>
    <circle cx="643" cy="108" r="3" fill="#5f7894"/>
    <text x="657" y="112" fill="#7089a3" font-family="Inter, Arial, sans-serif" font-size="10.5">keevinvieeira.github.io/curriculo-kevin/</text>
    <rect x="1156" y="98" width="57" height="20" rx="10" fill="#163754"/>
    <text x="1184.5" y="112" text-anchor="middle" fill="#6de2cd" font-family="Inter, Arial, sans-serif" font-size="9.5" font-weight="700">LIVE</text>

    <g clip-path="url(#screenClip)">
      <image x="554" y="128" width="666" height="458" xlink:href="career-os-interface.png" preserveAspectRatio="xMidYMid slice"/>
      <rect x="554" y="128" width="666" height="458" fill="url(#headline)" opacity="0.025"/>
    </g>

    <rect x="536" y="576" width="702" height="22" rx="0" fill="#101827" opacity="0.92"/>
    <text x="558" y="590.5" fill="#668099" font-family="Inter, Arial, sans-serif" font-size="9.5" letter-spacing="0.5">FONTE ÚNICA DE VERDADE · EXPERIÊNCIAS · SKILLS · MÉTRICAS</text>
  </g>

  <g transform="translate(520 610)" font-family="Inter, Arial, sans-serif">
    <circle cx="11" cy="11" r="11" fill="#4de1c3" opacity="0.14" stroke="#4de1c3"/>
    <path d="M7 11l3 3 6-7" fill="none" stroke="#70ead5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="15" fill="#a6bccd" font-size="13">Experimente o projeto</text>
    <text x="32" y="40" fill="#e0edf5" font-size="15" font-weight="650">keevinvieeira.github.io/curriculo-kevin/</text>
  </g>

  <text x="1215" y="682" text-anchor="end" fill="#66839c" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="1.3">CAREER OS · 2026</text>
</svg>
