<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Do currículo em PDF ao Career OS</title>
  <desc id="desc">Capa editorial mostrando a transformação de um documento em uma rede de experiências, competências, evidências e vagas.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.58" stop-color="#10284a"/>
      <stop offset="1" stop-color="#173b5d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d4b4"/>
      <stop offset="1" stop-color="#79e1ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020814" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#8fc7df" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#background)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <circle cx="1110" cy="70" r="290" fill="#1e6080" opacity="0.12"/>
  <circle cx="930" cy="680" r="300" fill="#1bc6ad" opacity="0.07"/>

  <g transform="translate(76 72)">
    <rect x="0" y="0" width="196" height="34" rx="17" fill="#39d4b4" opacity="0.13" stroke="#39d4b4" stroke-opacity="0.52"/>
    <text x="98" y="23" text-anchor="middle" fill="#78ead3" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">PRODUTO + IA</text>

    <text x="0" y="104" fill="#f4f8fc" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-1.8">
      <tspan x="0" dy="0">Do currículo em PDF</tspan>
      <tspan x="0" dy="69">ao </tspan><tspan fill="url(#accent)">Career OS</tspan>
    </text>

    <text x="2" y="278" fill="#b9cce0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="400">
      <tspan x="2" dy="0">Como transformei um documento estático em um sistema</tspan>
      <tspan x="2" dy="34">para gerenciar e comunicar minha trajetória profissional.</tspan>
    </text>

    <line x1="2" y1="382" x2="484" y2="382" stroke="url(#accent)" stroke-width="3"/>
    <text x="2" y="430" fill="#e3edf6" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650">KEVIN AUGUSTO VIEIRA</text>
    <text x="2" y="460" fill="#8fa9c1" font-family="Inter, Arial, sans-serif" font-size="15">Product Manager · GTM · AI Implementation</text>
  </g>

  <g transform="translate(700 116)" filter="url(#shadow)">
    <g transform="rotate(-4 136 215)">
      <rect x="0" y="0" width="272" height="414" rx="15" fill="#f8fbfd"/>
      <rect x="0" y="0" width="272" height="58" rx="15" fill="#e9f1f6"/>
      <rect x="0" y="43" width="272" height="15" fill="#e9f1f6"/>
      <circle cx="31" cy="29" r="12" fill="#173b5d"/>
      <rect x="54" y="20" width="101" height="9" rx="4.5" fill="#173b5d"/>
      <rect x="54" y="35" width="69" height="6" rx="3" fill="#7290a8"/>
      <text x="220" y="35" text-anchor="middle" fill="#d65555" font-family="Arial, sans-serif" font-size="13" font-weight="700">PDF</text>
      <rect x="24" y="86" width="110" height="9" rx="4.5" fill="#1d466a"/>
      <rect x="24" y="106" width="220" height="5" rx="2.5" fill="#b8c8d4"/>
      <rect x="24" y="118" width="203" height="5" rx="2.5" fill="#cad6df"/>
      <rect x="24" y="130" width="215" height="5" rx="2.5" fill="#cad6df"/>
      <rect x="24" y="161" width="84" height="8" rx="4" fill="#1d466a"/>
      <g fill="#9fb3c2">
        <circle cx="29" cy="190" r="3"/><circle cx="29" cy="219" r="3"/><circle cx="29" cy="248" r="3"/>
      </g>
      <g fill="#c0ced8">
        <rect x="40" y="187" width="190" height="5" rx="2.5"/><rect x="40" y="197" width="173" height="5" rx="2.5"/>
        <rect x="40" y="216" width="204" height="5" rx="2.5"/><rect x="40" y="226" width="160" height="5" rx="2.5"/>
        <rect x="40" y="245" width="181" height="5" rx="2.5"/><rect x="40" y="255" width="196" height="5" rx="2.5"/>
      </g>
      <rect x="24" y="291" width="98" height="8" rx="4" fill="#1d466a"/>
      <rect x="24" y="316" width="62" height="22" rx="11" fill="#dce9ef"/>
      <rect x="93" y="316" width="74" height="22" rx="11" fill="#dce9ef"/>
      <rect x="174" y="316" width="70" height="22" rx="11" fill="#dce9ef"/>
      <rect x="24" y="354" width="220" height="5" rx="2.5" fill="#cad6df"/>
      <rect x="24" y="366" width="184" height="5" rx="2.5" fill="#cad6df"/>
    </g>

    <g fill="none" stroke="#62d9cf" stroke-width="2" opacity="0.64">
      <path d="M245 74 C330 22 357 105 426 91"/>
      <path d="M252 163 C330 159 351 209 430 206"/>
      <path d="M241 269 C311 307 355 285 428 329"/>
      <path d="M363 91 C384 143 379 167 430 206"/>
      <path d="M430 206 C387 256 400 290 428 329"/>
      <path d="M430 206 C498 175 498 116 524 85"/>
      <path d="M430 206 C501 224 505 284 529 322"/>
    </g>

    <g font-family="Inter, Arial, sans-serif" filter="url(#glow)">
      <g transform="translate(426 91)"><circle r="36" fill="#153e5a" stroke="#6be3d1" stroke-width="2"/><text y="5" text-anchor="middle" fill="#dffbf6" font-size="12" font-weight="700">CASES</text></g>
      <g transform="translate(430 206)"><circle r="47" fill="#174d67" stroke="#79e1ff" stroke-width="2.5"/><text y="5" text-anchor="middle" fill="#e8fbff" font-size="12" font-weight="700">CARREIRA</text></g>
      <g transform="translate(428 329)"><circle r="39" fill="#153e5a" stroke="#6be3d1" stroke-width="2"/><text y="5" text-anchor="middle" fill="#dffbf6" font-size="11" font-weight="700">MÉTRICAS</text></g>
      <g transform="translate(524 85)"><circle r="34" fill="#153e5a" stroke="#79e1ff" stroke-width="2"/><text y="5" text-anchor="middle" fill="#e8fbff" font-size="11" font-weight="700">SKILLS</text></g>
      <g transform="translate(529 322)"><circle r="35" fill="#153e5a" stroke="#79e1ff" stroke-width="2"/><text y="5" text-anchor="middle" fill="#e8fbff" font-size="11" font-weight="700">VAGAS</text></g>
      <circle cx="363" cy="91" r="8" fill="#39d4b4"/>
      <circle cx="362" cy="207" r="7" fill="#79e1ff"/>
      <circle cx="364" cy="292" r="6" fill="#39d4b4"/>
      <circle cx="486" cy="145" r="6" fill="#79e1ff"/>
      <circle cx="488" cy="265" r="6" fill="#39d4b4"/>
    </g>
  </g>

  <text x="1205" y="676" text-anchor="end" fill="#6f8ca7" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="1.4">CAREER OS · 2026</text>
</svg>
