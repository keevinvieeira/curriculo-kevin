<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Grafo profissional interativo de Kevin Augusto Vieira: experiências, funções, competências e resultados comprovados.">
    <meta name="theme-color" content="#090a10">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Kevin Augusto Vieira | Grafo Profissional">
    <meta property="og:description" content="Explore experiências, funções, competências e resultados em um portfólio profissional interativo.">
    <meta property="og:url" content="https://keevinvieeira.github.io/curriculo-kevin/">
    <meta name="twitter:card" content="summary">
    <link rel="canonical" href="https://keevinvieeira.github.io/curriculo-kevin/">
    <title>Kevin Augusto Vieira - Grafo Profissional 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #090a10;
            color: #f8fafc;
            font-family: Inter, "Segoe UI", system-ui, sans-serif;
            overflow: hidden;
        }
        button { font: inherit; }
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #ui-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }
        #header {
            position: absolute;
            top: 22px;
            left: 22px;
            pointer-events: auto;
            max-width: min(620px, calc(100vw - 430px));
        }
        .header-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        #header h1 {
            font-size: 1.55rem;
            line-height: 1.1;
            font-weight: 750;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #header p {
            margin-top: 7px;
            color: #94a3b8;
            font-size: 0.82rem;
            line-height: 1.4;
        }
        #language-selector {
            display: inline-flex;
            padding: 3px;
            gap: 2px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.8);
        }
        .language-btn {
            border: 0;
            border-radius: 5px;
            padding: 4px 8px;
            color: #94a3b8;
            background: transparent;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 700;
        }
        .language-btn.active {
            color: #eff6ff;
            background: #2563eb;
        }
        #fullscreen-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 9px;
            color: #cbd5e1;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 650;
        }
        #fullscreen-btn:hover {
            color: #fff;
            border-color: #60a5fa;
            background: rgba(37, 99, 235, 0.22);
        }
        #fullscreen-icon { font-size: 1rem; line-height: 1; }
        #stats-bar {
            position: absolute;
            top: 22px;
            right: 22px;
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }
        .stat {
            min-width: 72px;
            padding: 7px 11px;
            text-align: center;
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 9px;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(12px);
        }
        .stat-value {
            color: #60a5fa;
            font-size: 1.2rem;
            line-height: 1.1;
            font-weight: 750;
        }
        .stat-label {
            margin-top: 2px;
            color: #94a3b8;
            font-size: 0.64rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        #company-filters {
            position: absolute;
            top: 104px;
            left: 22px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-width: 210px;
            pointer-events: auto;
        }
        .filter-btn {
            padding: 6px 10px;
            overflow: hidden;
            color: #a8b3c7;
            background: rgba(15, 23, 42, 0.68);
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 7px;
            cursor: pointer;
            text-align: left;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.72rem;
            transition: 160ms ease;
        }
        .filter-btn:hover,
        .filter-btn.active {
            color: #eff6ff;
            background: rgba(37, 99, 235, 0.28);
            border-color: #60a5fa;
        }
        #legend {
            position: absolute;
            left: 22px;
            bottom: 22px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            max-width: min(760px, calc(60vw - 44px));
            pointer-events: auto;
        }
        .legend-item {
            display: inline-flex;
            flex: 0 0 auto;
            align-items: center;
            gap: 5px;
            padding: 4px 7px;
            color: #b8c2d6;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.14);
            border-radius: 5px;
            font-size: 0.65rem;
            white-space: nowrap;
        }
        .legend-item.selectable {
            cursor: pointer;
            transition: 160ms ease;
        }
        .legend-item.selectable:hover,
        .legend-item.selectable.active {
            color: #fff;
            border-color: var(--legend-color);
            background: color-mix(in srgb, var(--legend-color) 18%, rgba(15, 23, 42, 0.85));
            box-shadow: 0 0 18px color-mix(in srgb, var(--legend-color) 32%, transparent);
        }
        .legend-color {
            width: 8px;
            height: 8px;
            flex: 0 0 auto;
            border-radius: 50%;
        }
        #instructions {
            position: absolute;
            left: 22px;
            bottom: 64px;
            color: #64748b;
            font-size: 0.68rem;
            pointer-events: none;
        }
        #detail-panel {
            position: absolute;
            top: 98px;
            right: 22px;
            width: 40vw;
            max-height: calc(100vh - 122px);
            padding: 18px;
            overflow-y: auto;
            display: none;
            pointer-events: auto;
            background: rgba(9, 10, 16, 0.96);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 13px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(18px);
        }
        #detail-panel.visible { display: block; }
        .detail-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }
        .detail-header-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }
        #detail-back {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 5px 11px;
            color: #93c5fd;
            background: rgba(37, 99, 235, 0.22);
            border: 1px solid rgba(96, 165, 250, 0.4);
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.74rem;
            font-weight: 700;
            transition: all 150ms ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }
        #detail-back.visible {
            display: inline-flex;
        }
        #detail-back:hover {
            color: #ffffff;
            background: rgba(37, 99, 235, 0.45);
            border-color: #60a5fa;
            transform: translateX(-3px);
            box-shadow: 0 0 12px rgba(96, 165, 250, 0.35);
        }
        .back-icon {
            font-size: 0.95rem;
            line-height: 1;
        }
        #detail-title {
            font-size: 1.05rem;
            line-height: 1.3;
            font-weight: 700;
        }
        #detail-close {
            width: 30px;
            height: 30px;
            flex: 0 0 auto;
            color: #cbd5e1;
            background: rgba(148, 163, 184, 0.1);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 7px;
            cursor: pointer;
            font-size: 1rem;
        }
        #detail-close:hover { color: #fff; border-color: #60a5fa; }
        .type-badge {
            display: inline-block;
            margin: 8px 0;
            padding: 3px 8px;
            color: #eff6ff;
            background: #2563eb;
            border-radius: 5px;
            font-size: 0.64rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        #detail-desc {
            color: #94a3b8;
            font-size: 0.76rem;
            line-height: 1.55;
        }
        .detail-section {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(148, 163, 184, 0.14);
        }
        .detail-section h4 {
            margin-bottom: 8px;
            color: #60a5fa;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .role-item,
        .skill-item,
        .metric-item {
            margin-bottom: 5px;
            padding: 8px 10px;
            background: rgba(30, 41, 59, 0.48);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 7px;
            font-size: 0.74rem;
            line-height: 1.4;
        }
        .role-item.clickable,
        .skill-item.clickable,
        .metric-item.clickable { cursor: pointer; transition: 150ms ease; }
        .role-item.clickable:hover,
        .skill-item.clickable:hover,
        .metric-item.clickable:hover { border-color: #60a5fa; background: rgba(37, 99, 235, 0.12); }
        .item-name,
        .metric-value { font-weight: 650; color: #e2e8f0; }
        .item-meta,
        .metric-context { margin-top: 2px; color: #8492a8; font-size: 0.68rem; }
        .metric-value { color: #fbbf24; }
        .evidence-block {
            margin-top: 7px;
            padding-top: 7px;
            border-top: 1px solid rgba(148, 163, 184, 0.12);
        }
        .evidence-role {
            color: #c4b5fd;
            font-size: 0.67rem;
            font-weight: 650;
        }
        .evidence-function {
            margin-top: 3px;
            color: #67e8f9;
            font-size: 0.7rem;
            font-weight: 650;
        }
        .evidence-text {
            margin-top: 3px;
            color: #a8b3c7;
            font-size: 0.69rem;
            line-height: 1.5;
        }
        #loading {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090a10;
            transition: opacity 400ms ease;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(148, 163, 184, 0.15);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 800ms linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 800px) {
            #header { top: 14px; left: 14px; max-width: calc(100vw - 28px); }
            #header h1 { font-size: 1.15rem; }
            #header p { max-width: 310px; font-size: 0.7rem; }
            #stats-bar { top: 82px; left: 14px; right: auto; gap: 4px; }
            .stat { min-width: 55px; padding: 5px 7px; }
            #company-filters { top: 140px; left: 14px; max-width: 160px; }
            .filter-btn { font-size: 0.65rem; }
            #legend {
                left: 14px;
                right: auto;
                bottom: 12px;
                width: calc(100vw - 28px);
                max-width: calc(100vw - 28px);
            }
            #instructions { display: none; }
            #detail-panel {
                top: auto;
                right: 10px;
                bottom: 10px;
                left: 10px;
                width: auto;
                max-height: 62vh;
            }
        }
    </style>
</head>
<body>
    <div id="loading"><div class="spinner"></div></div>
    <div id="canvas-container"></div>
    <div id="ui-overlay">
        <header id="header">
            <div class="header-row">
                <h1>Kevin Augusto Vieira</h1>
                <div id="language-selector" aria-label="Idioma / Language">
                    <button class="language-btn active" data-lang="pt" type="button">PT</button>
                    <button class="language-btn" data-lang="en" type="button">EN</button>
                </div>
                <button id="fullscreen-btn" type="button">
                    <span id="fullscreen-icon">⛶</span>
                    <span id="fullscreen-label"></span>
                </button>
            </div>
            <p id="subtitle"></p>
        </header>
        <div id="stats-bar">
            <div class="stat"><div class="stat-value" id="stat-companies">0</div><div class="stat-label" data-i18n="companies"></div></div>
            <div class="stat"><div class="stat-value" id="stat-roles">0</div><div class="stat-label" data-i18n="roles"></div></div>
            <div class="stat"><div class="stat-value" id="stat-abilities">0</div><div class="stat-label" data-i18n="abilities"></div></div>
            <div class="stat"><div class="stat-value" id="stat-skills">0</div><div class="stat-label" data-i18n="skills"></div></div>
            <div class="stat"><div class="stat-value" id="stat-results">0</div><div class="stat-label" data-i18n="results"></div></div>
        </div>
        <div id="company-filters"></div>
        <div id="instructions"></div>
        <div id="legend"></div>
        <aside id="detail-panel" aria-live="polite">
            <div class="detail-header">
                <div class="detail-header-left">
                    <button id="detail-back" type="button" aria-label="Voltar" title="Voltar ao item anterior" onclick="navigateBack()">
                        <span class="back-icon">←</span> <span id="detail-back-text" data-i18n="back">Voltar</span>
                    </button>
                    <h3 id="detail-title"></h3>
                </div>
                <button id="detail-close" type="button" aria-label="Fechar">×</button>
            </div>
            <span class="type-badge" id="detail-type"></span>
            <p id="detail-desc"></p>
            <section class="detail-section" id="section-roles">
                <h4 id="roles-heading" data-i18n="roles"></h4>
                <div id="detail-roles"></div>
            </section>
            <section class="detail-section" id="section-skills">
                <h4 id="skills-heading" data-i18n="skills"></h4>
                <div id="detail-skills"></div>
            </section>
            <section class="detail-section" id="section-metrics">
                <h4 id="metrics-heading" data-i18n="metrics"></h4>
                <div id="detail-metrics"></div>
            </section>
        </aside>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script id="graph-data" type="application/json">__GRAPH_DATA__</script>
    <script>
        const I18N = {
            pt: {
                pageTitle: 'Kevin Augusto Vieira - Grafo Profissional 3D',
                subtitle: 'Explore empresas, funções, skills compartilhadas e métricas. Fonte: master_resume.json',
                skills: 'Skills', companies: 'Empresas', metrics: 'Métricas', roles: 'Cargos', role: 'Cargo', functions: 'Funções',
                abilities: 'Habilidades', results: 'Resultados', result: 'Resultado',
                fullView: 'Visão completa', company: 'Empresa', location: 'Localização', period: 'Período',
                skill: 'Skill', category: 'Categoria', evidenceSection: 'Evidências no currículo',
                function: 'Função', demonstrates: 'Demonstra também',
                fullscreen: 'Tela cheia', exitFullscreen: 'Sair da tela cheia', fullscreenUnavailable: 'Tela cheia indisponível neste navegador',
                evidence: 'evidência nesta empresa', evidences: 'evidências nesta empresa',
                totalEvidence: 'no total', sharedWith: 'Também comprovada em',
                instructions: 'Clique em qualquer esfera = explorar detalhes • Arraste = girar • Scroll = zoom • Duplo clique ou Esc = visão completa',
                close: 'Fechar e voltar à visão completa',
                back: 'Voltar',
            },
            en: {
                pageTitle: 'Kevin Augusto Vieira - Professional Graph 3D',
                subtitle: 'Explore companies, functions, shared skills, and metrics. Source: master_resume.json',
                skills: 'Skills', companies: 'Companies', metrics: 'Metrics', roles: 'Roles', role: 'Role', functions: 'Functions',
                abilities: 'Skill areas', results: 'Outcomes', result: 'Outcome',
                fullView: 'Full view', company: 'Company', location: 'Location', period: 'Period',
                skill: 'Skill', category: 'Category', evidenceSection: 'Resume evidence',
                function: 'Function', demonstrates: 'Also demonstrates',
                fullscreen: 'Fullscreen', exitFullscreen: 'Exit fullscreen', fullscreenUnavailable: 'Fullscreen is unavailable in this browser',
                evidence: 'evidence at this company', evidences: 'evidence items at this company',
                totalEvidence: 'in total', sharedWith: 'Also demonstrated at',
                instructions: 'Click any sphere = explore details • Drag = rotate • Scroll = zoom • Double-click or Esc = full view',
                close: 'Close and return to full view',
                back: 'Back',
            },
        };

        const TYPE_COLORS = {
            Candidate: 0xffffff,
            Company: 0x60a5fa,
            Role: 0xa78bfa,
            Function: 0x22d3ee,
            Metric: 0xfbbf24,
        };

        function storedLanguage() {
            try {
                return localStorage.getItem('professionalGraphLanguage') || 'pt';
            } catch (error) {
                return 'pt';
            }
        }

        let graphData;
        let scene;
        let camera;
        let renderer;
        let controls;
        let raycaster;
        let mouse;
        let currentLanguage = storedLanguage();
        let selectedCompanyId = null;
        let selectedCategory = null;
        let selectedSkillId = null;
        let selectedType = null;
        let selectedNodeId = null;
        let clickTimer = null;
        const nodes3D = [];
        const edges3D = [];
        const nodeMeshes = new Map();
        const companyPositions = new Map();
        const initialCamera = new THREE.Vector3(0, 14, 34);

                let navigationHistory = [];
        let isNavigatingHistory = false;
        let currentViewState = null;

        function updateBackButton() {
            const backBtn = document.getElementById('detail-back');
            if (!backBtn) return;
            if (navigationHistory.length > 0) {
                backBtn.classList.add('visible');
                backBtn.style.display = 'inline-flex';
                const last = navigationHistory[navigationHistory.length - 1];
                const prevTitle = last && last.title ? ` (${last.title})` : '';
                backBtn.setAttribute('title', (currentLanguage === 'pt' ? 'Voltar para' : 'Back to') + prevTitle);
                const labelElem = document.getElementById('detail-back-text');
                if (labelElem) labelElem.textContent = t('back');
            } else {
                backBtn.classList.remove('visible');
                backBtn.style.display = 'none';
            }
        }

        function pushNavigationState(state) {
            if (isNavigatingHistory) return;
            if (currentViewState) {
                if (currentViewState.action === state.action && currentViewState.id === state.id) {
                    return;
                }
                navigationHistory.push(currentViewState);
                if (navigationHistory.length > 50) navigationHistory.shift();
            }
            currentViewState = state;
            updateBackButton();
        }

        function navigateBack() {
            if (navigationHistory.length === 0) {
                resetFullView();
                return;
            }
            const prevState = navigationHistory.pop();
            isNavigatingHistory = true;
            try {
                currentViewState = prevState;
                if (prevState.action === 'company') {
                    focusOnCompany(prevState.id, false);
                } else if (prevState.action === 'skill') {
                    focusOnSkill(prevState.id, false);
                } else if (prevState.action === 'node') {
                    focusOnProfessionalNode(prevState.id, false);
                } else if (prevState.action === 'category') {
                    selectCategory(prevState.id);
                } else if (prevState.action === 'type') {
                    selectType(prevState.id);
                } else if (prevState.action === 'fullView') {
                    resetFullView(false);
                }
            } catch (err) {
                console.error('Error in navigateBack:', err);
            } finally {
                isNavigatingHistory = false;
                updateBackButton();
            }
        }

        function t(key) { return I18N[currentLanguage][key] || key; }
        function localized(value) {
            if (!value) return '';
            if (typeof value === 'string') return value;
            return value[currentLanguage] || value.pt || value.en || '';
        }
        function nodeLabel(node) { return localized(node.labels) || node.label || node.id; }
        function getNode(id) { return graphData.nodes.find(node => node.id === id); }
        function connectedCompanyIds(node) {
            if (node.type === 'Company') return [node.id];
            if (node.company_id) return [node.company_id];
            if (node.companies) return node.companies;
            return graphData.edges
                .filter(edge => edge.target === node.id && getNode(edge.source)?.type === 'Company')
                .map(edge => edge.source);
        }
        function seededUnit(value) {
            let hash = 2166136261;
            for (let i = 0; i < value.length; i += 1) {
                hash ^= value.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            return (hash >>> 0) / 4294967295;
        }

        async function init() {
            try {
                const raw = document.getElementById('graph-data').textContent.trim();
                graphData = JSON.parse(raw);
            } catch (error) {
                console.error('Unable to load graph data', error);
                document.getElementById('loading').innerHTML = '<p>Unable to load graph data.</p>';
                return;
            }

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x090a10);
            scene.fog = new THREE.FogExp2(0x090a10, 0.011);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(initialCamera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 85;
            controls.minDistance = 5;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.15;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            scene.add(new THREE.AmbientLight(0x64748b, 0.55));
            const blueLight = new THREE.PointLight(0x60a5fa, 1, 110);
            blueLight.position.set(20, 20, 20);
            scene.add(blueLight);
            const violetLight = new THREE.PointLight(0xa855f7, 0.65, 100);
            violetLight.position.set(-20, -10, 10);
            scene.add(violetLight);

            createNodes();
            createEdges();
            updateStats();
            bindEvents();
            setLanguage(currentLanguage);
            resetFullView();
            document.getElementById('loading').classList.add('hidden');
            animate();
        }

        function createNodes() {
            const companies = graphData.nodes.filter(node => node.type === 'Company');
            companies.forEach((company, index) => {
                const angle = (index / companies.length) * Math.PI * 2;
                const position = new THREE.Vector3(
                    13 * Math.cos(angle),
                    (seededUnit(company.id) - 0.5) * 3,
                    13 * Math.sin(angle)
                );
                companyPositions.set(company.id, position);
            });

            graphData.nodes.forEach((node, index) => {
                const parsedColor = Number.parseInt((node.color || '').replace('#', ''), 16);
                const color = Number.isNaN(parsedColor) ? (TYPE_COLORS[node.type] || 0x94a3b8) : parsedColor;
                const size = node.size || 0.5;
                const geometry = new THREE.SphereGeometry(size * 0.32, 28, 28);
                const material = new THREE.MeshBasicMaterial({
                    color,
                    transparent: true,
                    opacity: node.glow ? 1 : 0.86,
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.copy(positionForNode(node, index));
                mesh.userData = { ...node, basePosition: mesh.position.clone(), baseOpacity: material.opacity };

                if (node.glow || node.type === 'Company') {
                    const glow = new THREE.Sprite(new THREE.SpriteMaterial({
                        map: createGlowTexture(color),
                        transparent: true,
                        opacity: 0.34,
                    }));
                    glow.scale.set(size * 3, size * 3, 1);
                    glow.userData = { isGlow: true, baseOpacity: 0.34 };
                    mesh.add(glow);
                }
                if (node.type === 'Candidate' || node.type === 'Company' || node.type === 'Skill') {
                    const labelColor = node.type === 'Candidate' ? '#ffffff' : node.type === 'Skill' ? node.color : '#bfdbfe';
                    const label = createTextSprite(nodeLabel(node), labelColor);
                    label.position.set(0, size * 0.55, 0);
                    label.visible = node.type !== 'Skill';
                    label.userData.isNodeLabel = true;
                    mesh.add(label);
                    mesh.userData.labelSprite = label;
                }

                scene.add(mesh);
                nodes3D.push(mesh);
                nodeMeshes.set(node.id, mesh);
            });
        }

        function positionForNode(node, index) {
            if (node.type === 'Candidate') return new THREE.Vector3(0, 0, 0);
            if (node.type === 'Company') return companyPositions.get(node.id).clone();

            const companyIds = connectedCompanyIds(node);
            const points = companyIds.map(id => companyPositions.get(id)).filter(Boolean);
            const center = points.length
                ? points.reduce((sum, point) => sum.add(point), new THREE.Vector3()).divideScalar(points.length)
                : new THREE.Vector3();
            const angle = seededUnit(`${node.id}-angle`) * Math.PI * 2;
            const vertical = (seededUnit(`${node.id}-height`) - 0.5) * 5;

            if (node.type === 'Role') {
                return center.add(new THREE.Vector3(2.1 * Math.cos(angle), vertical * 0.45, 2.1 * Math.sin(angle)));
            }
            if (node.type === 'Function') {
                return center.add(new THREE.Vector3(3.4 * Math.cos(angle), vertical * 0.6, 3.4 * Math.sin(angle)));
            }
            if (node.type === 'Metric') {
                return center.add(new THREE.Vector3(3.1 * Math.cos(angle), vertical * 0.65, 3.1 * Math.sin(angle)));
            }
            if (node.type === 'Skill' && points.length > 1) {
                const spread = 1.2 + seededUnit(`${node.id}-spread`) * 1.4;
                return center.add(new THREE.Vector3(spread * Math.cos(angle), vertical, spread * Math.sin(angle)));
            }
            const radius = 4.2 + seededUnit(`${node.id}-radius`) * 2.8;
            return center.add(new THREE.Vector3(radius * Math.cos(angle), vertical, radius * Math.sin(angle)));
        }

        function createEdges() {
            graphData.edges.forEach(edge => {
                const sourceMesh = nodeMeshes.get(edge.source);
                const targetMesh = nodeMeshes.get(edge.target);
                if (!sourceMesh || !targetMesh) return;
                const geometry = new THREE.BufferGeometry().setFromPoints([sourceMesh.position, targetMesh.position]);
                const baseOpacity = edge.type === 'WORKED_AT' ? 0.32 : edge.type === 'DEMONSTRATES' ? 0.2 : 0.26;
                const material = new THREE.LineBasicMaterial({
                    color: edge.type === 'DEMONSTRATES' ? 0x475569 : 0x64748b,
                    transparent: true,
                    opacity: baseOpacity,
                });
                const line = new THREE.Line(geometry, material);
                line.userData = { ...edge, baseOpacity };
                scene.add(line);
                edges3D.push(line);
            });
        }

        function createGlowTexture(color) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const context = canvas.getContext('2d');
            const hex = `#${color.toString(16).padStart(6, '0')}`;
            const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, hex);
            gradient.addColorStop(1, 'transparent');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        function createTextSprite(text, color) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const fontSize = 30;
            context.font = `600 ${fontSize}px Inter, Segoe UI, sans-serif`;
            const width = Math.ceil(context.measureText(text).width + 28);
            canvas.width = Math.max(128, width);
            canvas.height = 52;
            context.font = `600 ${fontSize}px Inter, Segoe UI, sans-serif`;
            context.fillStyle = 'rgba(9, 10, 16, 0.78)';
            context.roundRect(0, 4, canvas.width, 44, 10);
            context.fill();
            context.fillStyle = color;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(text, canvas.width / 2, 26);
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
            sprite.scale.set(Math.min(7, canvas.width / 38), 1.3, 1);
            sprite.userData = { text, color, baseOpacity: 1 };
            return sprite;
        }

        function setNodeAppearance(mesh, opacity, scale, showSkillLabel = false) {
            mesh.material.opacity = opacity;
            mesh.scale.setScalar(scale);
            mesh.children.forEach(child => {
                if (child.userData.isNodeLabel) {
                    if (mesh.userData.type === 'Skill') {
                        child.visible = showSkillLabel;
                        child.material.opacity = showSkillLabel ? 1 : 0;
                    } else {
                        child.material.opacity = Math.max(0.08, opacity);
                    }
                } else if (child.userData.isGlow) {
                    child.material.opacity = child.userData.baseOpacity * Math.max(0.08, opacity);
                }
            });
        }

        function replaceTextSprite(mesh, text, color) {
            const oldSprite = mesh.userData.labelSprite;
            const wasVisible = oldSprite?.visible ?? true;
            if (oldSprite) mesh.remove(oldSprite);
            const sprite = createTextSprite(text, color);
            sprite.position.set(0, (mesh.userData.size || 1) * 0.55, 0);
            sprite.visible = wasVisible;
            sprite.userData.isNodeLabel = true;
            mesh.add(sprite);
            mesh.userData.labelSprite = sprite;
        }

        function bindEvents() {
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', event => {
                if (event.key === 'Escape') resetFullView();
                if ((event.altKey && event.key === 'ArrowLeft') || (event.key === 'Backspace' && !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName))) {
                    navigateBack();
                }
            });
            renderer.domElement.addEventListener('click', onClick);
            renderer.domElement.addEventListener('dblclick', onDoubleClick);
            document.getElementById('detail-close').addEventListener('click', () => resetFullView());
            const backBtn = document.getElementById('detail-back');
            if (backBtn) {
                backBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    navigateBack();
                });
            }
            document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);
            document.addEventListener('fullscreenchange', () => {
                updateFullscreenButton();
                window.setTimeout(onWindowResize, 80);
            });
            document.querySelectorAll('.language-btn').forEach(button => {
                button.addEventListener('click', () => setLanguage(button.dataset.lang));
            });
        }

        function setLanguage(language) {
            currentLanguage = language === 'en' ? 'en' : 'pt';
            try {
                localStorage.setItem('professionalGraphLanguage', currentLanguage);
            } catch (error) {
                // Sandboxed embeds may block storage; language still works for this session.
            }
            document.documentElement.lang = currentLanguage === 'pt' ? 'pt-BR' : 'en';
            document.title = t('pageTitle');
            document.getElementById('subtitle').textContent = t('subtitle');
            document.getElementById('instructions').textContent = t('instructions');
            document.getElementById('detail-close').setAttribute('aria-label', t('close'));
            updateFullscreenButton();
            document.querySelectorAll('[data-i18n]').forEach(element => {
                element.textContent = t(element.dataset.i18n);
            });
            document.querySelectorAll('.language-btn').forEach(button => {
                button.classList.toggle('active', button.dataset.lang === currentLanguage);
            });
            nodes3D.forEach(mesh => {
                if (!mesh.userData.labelSprite) return;
                const color = mesh.userData.type === 'Candidate'
                    ? '#ffffff'
                    : mesh.userData.type === 'Skill' ? mesh.userData.color : '#bfdbfe';
                replaceTextSprite(mesh, nodeLabel(mesh.userData), color);
            });
            buildCompanyFilters();
            buildLegend();
            if (selectedCompanyId) showCompanyInsights(selectedCompanyId);
            if (selectedSkillId) showSkillInsights(selectedSkillId);
            if (selectedNodeId) showProfessionalNodeInsights(selectedNodeId);
        }

        async function toggleFullscreen() {
            try {
                if (document.fullscreenElement) {
                    await document.exitFullscreen();
                } else if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                } else {
                    throw new Error('Fullscreen API unavailable');
                }
            } catch (error) {
                const button = document.getElementById('fullscreen-btn');
                button.title = t('fullscreenUnavailable');
                console.warn(t('fullscreenUnavailable'), error);
            }
        }

        function updateFullscreenButton() {
            const active = Boolean(document.fullscreenElement);
            document.getElementById('fullscreen-icon').textContent = active ? '×' : '⛶';
            document.getElementById('fullscreen-label').textContent = active ? t('exitFullscreen') : t('fullscreen');
            document.getElementById('fullscreen-btn').setAttribute('aria-label', active ? t('exitFullscreen') : t('fullscreen'));
        }

        function updateStats() {
            const stats = graphData.stats || {};
            document.getElementById('stat-companies').textContent = stats.total_companies ?? 0;
            document.getElementById('stat-roles').textContent = stats.total_roles ?? 0;
            document.getElementById('stat-abilities').textContent = Object.keys(graphData.categories || {}).length;
            document.getElementById('stat-skills').textContent = stats.total_skills ?? 0;
            document.getElementById('stat-results').textContent = stats.total_metrics ?? 0;
        }

        function buildCompanyFilters() {
            const container = document.getElementById('company-filters');
            container.innerHTML = '';
            const fullView = document.createElement('button');
            fullView.type = 'button';
            fullView.className = `filter-btn${selectedCompanyId || selectedCategory || selectedSkillId || selectedType || selectedNodeId ? '' : ' active'}`;
            fullView.textContent = `↺ ${t('fullView')}`;
            fullView.addEventListener('click', resetFullView);
            container.appendChild(fullView);

            graphData.nodes.filter(node => node.type === 'Company').forEach(company => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `filter-btn${selectedCompanyId === company.id ? ' active' : ''}`;
                button.textContent = nodeLabel(company);
                button.addEventListener('click', () => focusOnCompany(company.id));
                container.appendChild(button);
            });
        }

        function buildLegend() {
            const legend = document.getElementById('legend');
            legend.innerHTML = '';
            const items = [
                { label: 'Kevin', color: '#ffffff', type: 'Candidate' },
                { label: t('company'), color: '#60a5fa', type: 'Company' },
                { label: t('roles'), color: '#a78bfa', type: 'Role' },
                { label: t('functions'), color: '#22d3ee', type: 'Function' },
                { label: t('metrics'), color: '#fbbf24', type: 'Metric' },
                ...Object.entries(graphData.categories || {}).map(([key, category]) => ({
                    label: localized(category),
                    color: category.color,
                    category: key,
                })),
            ];
            items.forEach(({ label, color, category, type }) => {
                const item = document.createElement('div');
                const active = selectedCategory === category || selectedType === type;
                const count = category
                    ? graphData.nodes.filter(node => node.type === 'Skill' && node.category === category).length
                    : graphData.nodes.filter(node => node.type === type).length;
                const countedLabel = type === 'Candidate' ? label : `${label} (${count})`;
                item.className = `legend-item selectable${active ? ' active' : ''}`;
                item.style.setProperty('--legend-color', color);
                item.innerHTML = `<span class="legend-color" style="background:${color}"></span>${countedLabel}`;
                const activate = () => category ? selectCategory(category) : selectType(type);
                item.setAttribute('role', 'button');
                item.setAttribute('tabindex', '0');
                item.setAttribute('aria-pressed', active ? 'true' : 'false');
                item.addEventListener('click', activate);
                item.addEventListener('keydown', event => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        activate();
                    }
                });
                legend.appendChild(item);
            });
        }

        function selectType(type) {
            if (selectedType === type) {
                resetFullView();
                return;
            }
            selectedType = type;
            selectedCategory = null;
            selectedCompanyId = null;
            selectedSkillId = null;
            selectedNodeId = null;
            controls.autoRotate = false;
            document.getElementById('detail-panel').classList.remove('visible');

            const edgeType = {
                Candidate: 'WORKED_AT',
                Company: 'WORKED_AT',
                Role: 'HAS_ROLE',
                Function: 'HAS_FUNCTION',
                Metric: 'HAS_METRIC',
            }[type];
            const primaryIds = new Set(
                graphData.nodes.filter(node => node.type === type).map(node => node.id)
            );
            const relatedEdges = graphData.edges.filter(edge =>
                edge.type === edgeType && (primaryIds.has(edge.source) || primaryIds.has(edge.target))
            );
            const connectedIds = new Set();
            relatedEdges.forEach(edge => {
                connectedIds.add(edge.source);
                connectedIds.add(edge.target);
            });
            nodes3D.forEach(mesh => {
                const primary = primaryIds.has(mesh.userData.id);
                const connected = connectedIds.has(mesh.userData.id);
                setNodeAppearance(mesh, primary ? 1 : connected ? 0.65 : 0.035, primary ? 1.4 : connected ? 1.08 : 0.78, false);
            });
            const relatedKeys = new Set(relatedEdges.map(edge => `${edge.source}:${edge.target}:${edge.type}`));
            edges3D.forEach(line => {
                const key = `${line.userData.source}:${line.userData.target}:${line.userData.type}`;
                line.material.opacity = relatedKeys.has(key) ? 0.78 : 0.012;
            });
            buildCompanyFilters();
            buildLegend();
        }

        function selectCategory(category) {
            if (selectedCategory === category) {
                resetFullView();
                return;
            }
            selectedCategory = category;
            selectedCompanyId = null;
            selectedSkillId = null;
            selectedType = null;
            selectedNodeId = null;
            controls.autoRotate = false;
            document.getElementById('detail-panel').classList.remove('visible');
            const skillIds = new Set(
                graphData.nodes
                    .filter(node => node.type === 'Skill' && node.category === category)
                    .map(node => node.id)
            );
            const functionIds = new Set();
            graphData.nodes
                .filter(node => node.type === 'Skill' && skillIds.has(node.id))
                .forEach(skill => (skill.function_ids || []).forEach(id => functionIds.add(id)));
            const functions = [...functionIds].map(getNode).filter(Boolean);
            const roleIds = new Set(functions.map(node => node.role_id));
            const companyIds = new Set(functions.map(node => node.company_id));
            const relatedIds = new Set([...skillIds, ...functionIds, ...roleIds, ...companyIds]);
            nodes3D.forEach(mesh => {
                const isSkill = skillIds.has(mesh.userData.id);
                const isFunction = functionIds.has(mesh.userData.id);
                const isRole = roleIds.has(mesh.userData.id);
                const isCompany = companyIds.has(mesh.userData.id);
                const isCandidate = mesh.userData.type === 'Candidate';
                const opacity = isSkill ? 1 : isFunction ? 0.9 : isRole || isCompany ? 0.65 : isCandidate ? 0.2 : 0.025;
                const scale = isSkill ? 1.42 : isFunction ? 1.2 : isRole || isCompany ? 1.08 : 0.76;
                setNodeAppearance(mesh, opacity, scale, isSkill);
            });
            edges3D.forEach(line => {
                const related = relatedIds.has(line.userData.source) && relatedIds.has(line.userData.target);
                line.material.opacity = related ? 0.78 : 0.012;
            });
            buildCompanyFilters();
            buildLegend();
        }

        function focusOnCompany(companyId, pushState = true) {
            const companyMesh = nodeMeshes.get(companyId);
            if (!companyMesh) return;
            const company = getNode(companyId);
            if (pushState) {
                pushNavigationState({ action: 'company', id: companyId, title: company ? nodeLabel(company) : companyId });
            }
            selectedCompanyId = companyId;
            selectedCategory = null;
            selectedSkillId = null;
            selectedType = null;
            selectedNodeId = null;
            controls.autoRotate = false;
            controls.target.copy(companyMesh.position);
            camera.position.copy(companyMesh.position).add(new THREE.Vector3(9, 7, 9));
            highlightCompanyNodes(companyId);
            showCompanyInsights(companyId);
            buildCompanyFilters();
            buildLegend();
            updateBackButton();
        }

        function highlightCompanyNodes(companyId) {
            const relatedIds = new Set(
                graphData.nodes
                    .filter(node =>
                        node.id === companyId ||
                        node.company_id === companyId ||
                        node.companies?.includes(companyId)
                    )
                    .map(node => node.id)
            );
            relatedIds.add('candidate');
            nodes3D.forEach(mesh => {
                const related = relatedIds.has(mesh.userData.id);
                setNodeAppearance(mesh, related ? mesh.userData.baseOpacity : 0.08, related ? 1.16 : 0.86, false);
            });
            edges3D.forEach(line => {
                const related = relatedIds.has(line.userData.source) && relatedIds.has(line.userData.target);
                line.material.opacity = related ? 0.7 : 0.025;
            });
        }

        function showCompanyInsights(companyId) {
            const company = getNode(companyId);
            if (!company) return;
            const roles = graphData.nodes.filter(node => node.type === 'Role' && node.company_id === companyId);
            const skills = graphData.nodes.filter(node => node.type === 'Skill' && node.companies?.includes(companyId));
            const metrics = graphData.nodes.filter(node => node.type === 'Metric' && node.company_id === companyId);
            const panel = document.getElementById('detail-panel');
            panel.classList.add('visible');
            document.getElementById('section-roles').style.display = '';
            document.getElementById('section-skills').style.display = '';
            document.getElementById('section-metrics').style.display = '';
            document.getElementById('roles-heading').textContent = t('roles');
            document.getElementById('skills-heading').textContent = t('skills');
            document.getElementById('metrics-heading').textContent = t('metrics');
            document.getElementById('detail-title').textContent = nodeLabel(company);
            document.getElementById('detail-type').textContent = t('company');
            document.getElementById('detail-desc').textContent = [
                `${t('location')}: ${localized(company.location)}`,
                `${t('period')}: ${localized(company.dates)}`,
                `${skills.length} ${t('skills').toLocaleLowerCase()}`,
                `${metrics.length} ${t('metrics').toLocaleLowerCase()}`,
            ].join(' • ');

            const rolesDiv = document.getElementById('detail-roles');
            rolesDiv.innerHTML = '';
            roles.forEach(role => {
                const item = document.createElement('div');
                item.className = 'role-item clickable';
                item.innerHTML = `<div class="item-name"></div><div class="item-meta"></div>`;
                item.querySelector('.item-name').textContent = nodeLabel(role);
                item.querySelector('.item-meta').textContent = localized(role.dates);
                item.addEventListener('click', () => focusOnProfessionalNode(role.id));
                rolesDiv.appendChild(item);
            });

            const skillsDiv = document.getElementById('detail-skills');
            skillsDiv.innerHTML = '';
            skills.sort((a, b) => (b.evidence_by_company?.[companyId] || 0) - (a.evidence_by_company?.[companyId] || 0));
            skills.forEach(skill => {
                const companyEvidence = skill.evidence_by_company?.[companyId] || 0;
                const otherCompanies = skill.companies
                    .filter(id => id !== companyId)
                    .map(id => nodeLabel(getNode(id)));
                const evidenceLabel = companyEvidence === 1 ? t('evidence') : t('evidences');
                const metadata = [`${companyEvidence} ${evidenceLabel}`, `${skill.evidence_count} ${t('totalEvidence')}`];
                if (otherCompanies.length) metadata.push(`${t('sharedWith')}: ${otherCompanies.join(', ')}`);
                const item = document.createElement('div');
                item.className = 'skill-item clickable';
                item.innerHTML = `<div class="item-name"></div><div class="item-meta"></div>`;
                item.querySelector('.item-name').textContent = nodeLabel(skill);
                item.querySelector('.item-meta').textContent = metadata.join(' • ');
                appendSkillEvidence(item, skill, companyId, false, false);
                item.addEventListener('click', () => focusOnSkill(skill.id));
                skillsDiv.appendChild(item);
            });

            const metricsDiv = document.getElementById('detail-metrics');
            metricsDiv.innerHTML = '';
            metrics.forEach(metric => {
                const item = document.createElement('div');
                item.className = 'metric-item clickable';
                item.innerHTML = `<div class="metric-value"></div><div class="metric-context"></div>`;
                item.querySelector('.metric-value').textContent = `${nodeLabel(metric)} · ${localized(metric.names)}`;
                item.querySelector('.metric-context').textContent = localized(metric.contexts);
                item.addEventListener('click', () => focusOnProfessionalNode(metric.id));
                metricsDiv.appendChild(item);
            });
        }

        function appendSkillEvidence(container, skill, companyId = null, includeCompany = true, showDescription = true) {
            const functions = (skill.function_ids || [])
                .map(getNode)
                .filter(node => node && (!companyId || node.company_id === companyId));
            functions.forEach(jobFunction => {
                const company = getNode(jobFunction.company_id);
                const role = getNode(jobFunction.role_id);
                const block = document.createElement('div');
                block.className = 'evidence-block';
                const roleLine = document.createElement('div');
                roleLine.className = 'evidence-role';
                roleLine.textContent = includeCompany
                    ? `${nodeLabel(company)} • ${nodeLabel(role)}`
                    : nodeLabel(role);
                const functionLine = document.createElement('div');
                functionLine.className = 'evidence-function';
                functionLine.textContent = `${t('function')}: ${nodeLabel(jobFunction)}`;
                const description = document.createElement('div');
                description.className = 'evidence-text';
                description.textContent = localized(jobFunction.descriptions);
                block.appendChild(roleLine);
                block.appendChild(functionLine);
                if (showDescription) {
                    const demonstratedSkills = graphData.edges
                        .filter(edge => edge.type === 'DEMONSTRATES_SKILL' && edge.source === jobFunction.id)
                        .map(edge => nodeLabel(getNode(edge.target)))
                        .filter(label => label !== nodeLabel(skill));
                    if (demonstratedSkills.length) {
                        const shared = document.createElement('div');
                        shared.className = 'item-meta';
                        shared.textContent = `${t('demonstrates')}: ${demonstratedSkills.join(', ')}`;
                        block.appendChild(shared);
                    }
                    block.appendChild(description);
                }
                container.appendChild(block);
            });
        }

        function focusOnSkill(skillId, pushState = true) {
            const skill = getNode(skillId);
            const skillMesh = nodeMeshes.get(skillId);
            if (!skill || !skillMesh) return;
            if (pushState) {
                pushNavigationState({ action: 'skill', id: skillId, title: nodeLabel(skill) });
            }
            selectedSkillId = skillId;
            selectedCompanyId = null;
            selectedCategory = null;
            selectedType = null;
            selectedNodeId = null;
            controls.autoRotate = false;
            controls.target.copy(skillMesh.position);
            camera.position.copy(skillMesh.position).add(new THREE.Vector3(7, 6, 7));
            const functionIds = new Set(skill.function_ids || []);
            const functions = [...functionIds].map(getNode).filter(Boolean);
            const roleIds = new Set(functions.map(node => node.role_id));
            const relatedCompanyIds = new Set(functions.map(node => node.company_id));
            const relatedIds = new Set([skillId, ...functionIds, ...roleIds, ...relatedCompanyIds]);
            nodes3D.forEach(mesh => {
                const selected = mesh.userData.id === skillId;
                const isFunction = functionIds.has(mesh.userData.id);
                const isPath = relatedIds.has(mesh.userData.id);
                const opacity = selected ? 1 : isFunction ? 0.9 : isPath ? 0.65 : 0.025;
                setNodeAppearance(mesh, opacity, selected ? 1.55 : isFunction ? 1.2 : isPath ? 1.08 : 0.76, selected);
            });
            edges3D.forEach(line => {
                const related = relatedIds.has(line.userData.source) && relatedIds.has(line.userData.target);
                line.material.opacity = related ? 0.85 : 0.012;
            });
            showSkillInsights(skillId);
            buildCompanyFilters();
            buildLegend();
            updateBackButton();
        }

        function showSkillInsights(skillId) {
            const skill = getNode(skillId);
            if (!skill) return;
            const panel = document.getElementById('detail-panel');
            panel.classList.add('visible');
            document.getElementById('section-roles').style.display = 'none';
            document.getElementById('section-skills').style.display = '';
            document.getElementById('section-metrics').style.display = 'none';
            document.getElementById('skills-heading').textContent = t('evidenceSection');
            document.getElementById('detail-title').textContent = nodeLabel(skill);
            document.getElementById('detail-type').textContent = t('skill');
            document.getElementById('detail-desc').textContent = [
                `${t('category')}: ${localized(skill.category_labels)}`,
                `${skill.evidence_count} ${t('totalEvidence')}`,
                `${skill.companies.length} ${t('companies').toLocaleLowerCase()}`,
            ].join(' • ');
            const skillsDiv = document.getElementById('detail-skills');
            skillsDiv.innerHTML = '';
            const evidenceContainer = document.createElement('div');
            evidenceContainer.className = 'skill-item';
            appendSkillEvidence(evidenceContainer, skill, null, true, true);
            skillsDiv.appendChild(evidenceContainer);
        }

        function skillsForFunctions(functionIds) {
            const ids = new Set(functionIds);
            return graphData.nodes.filter(node =>
                node.type === 'Skill' && node.function_ids?.some(id => ids.has(id))
            );
        }

        function renderSkillItems(container, skills) {
            container.innerHTML = '';
            skills
                .sort((a, b) => b.evidence_count - a.evidence_count)
                .forEach(skill => {
                    const item = document.createElement('div');
                    item.className = 'skill-item clickable';
                    item.innerHTML = `<div class="item-name"></div><div class="item-meta"></div>`;
                    item.querySelector('.item-name').textContent = nodeLabel(skill);
                    item.querySelector('.item-meta').textContent = `${skill.evidence_count} ${t('totalEvidence')}`;
                    item.addEventListener('click', () => focusOnSkill(skill.id));
                    container.appendChild(item);
                });
        }

        function focusOnProfessionalNode(nodeId, pushState = true) {
            const node = getNode(nodeId);
            const nodeMesh = nodeMeshes.get(nodeId);
            if (!node || !nodeMesh || !['Role', 'Function', 'Metric'].includes(node.type)) return;

            if (pushState) {
                pushNavigationState({ action: 'node', id: nodeId, title: nodeLabel(node) });
            }
            selectedNodeId = nodeId;
            selectedCompanyId = null;
            selectedCategory = null;
            selectedSkillId = null;
            selectedType = null;
            controls.autoRotate = false;
            controls.target.copy(nodeMesh.position);
            camera.position.copy(nodeMesh.position).add(new THREE.Vector3(7, 6, 7));

            const relatedIds = new Set(['candidate', node.id]);
            if (node.company_id) relatedIds.add(node.company_id);
            if (node.type === 'Role') {
                const functions = graphData.nodes.filter(item => item.type === 'Function' && item.role_id === node.id);
                functions.forEach(item => relatedIds.add(item.id));
                skillsForFunctions(functions.map(item => item.id)).forEach(item => relatedIds.add(item.id));
                graphData.nodes
                    .filter(item => item.type === 'Metric' && item.company_id === node.company_id)
                    .forEach(item => relatedIds.add(item.id));
            } else if (node.type === 'Function') {
                relatedIds.add(node.role_id);
                skillsForFunctions([node.id]).forEach(item => relatedIds.add(item.id));
            } else {
                graphData.nodes
                    .filter(item => item.type === 'Role' && item.company_id === node.company_id)
                    .forEach(item => relatedIds.add(item.id));
            }

            nodes3D.forEach(mesh => {
                const selected = mesh.userData.id === node.id;
                const related = relatedIds.has(mesh.userData.id);
                setNodeAppearance(mesh, selected ? 1 : related ? 0.68 : 0.025, selected ? 1.55 : related ? 1.08 : 0.76, false);
            });
            edges3D.forEach(line => {
                const related = relatedIds.has(line.userData.source) && relatedIds.has(line.userData.target);
                line.material.opacity = related ? 0.82 : 0.012;
            });
            showProfessionalNodeInsights(nodeId);
            buildCompanyFilters();
            buildLegend();
            updateBackButton();
        }

        function showProfessionalNodeInsights(nodeId) {
            const node = getNode(nodeId);
            if (!node) return;
            const company = getNode(node.company_id);
            const panel = document.getElementById('detail-panel');
            const rolesSection = document.getElementById('section-roles');
            const skillsSection = document.getElementById('section-skills');
            const metricsSection = document.getElementById('section-metrics');
            const rolesDiv = document.getElementById('detail-roles');
            const skillsDiv = document.getElementById('detail-skills');
            const metricsDiv = document.getElementById('detail-metrics');
            panel.classList.add('visible');
            rolesDiv.innerHTML = '';
            skillsDiv.innerHTML = '';
            metricsDiv.innerHTML = '';

            if (node.type === 'Role') {
                const functions = graphData.nodes.filter(item => item.type === 'Function' && item.role_id === node.id);
                const skills = skillsForFunctions(functions.map(item => item.id));
                const metrics = graphData.nodes.filter(item => item.type === 'Metric' && item.company_id === node.company_id);
                document.getElementById('detail-title').textContent = nodeLabel(node);
                document.getElementById('detail-type').textContent = t('role');
                document.getElementById('detail-desc').textContent = [
                    nodeLabel(company), localized(node.dates), `${functions.length} ${t('functions').toLocaleLowerCase()}`,
                    `${skills.length} ${t('skills').toLocaleLowerCase()}`,
                ].filter(Boolean).join(' • ');
                rolesSection.style.display = '';
                skillsSection.style.display = '';
                metricsSection.style.display = '';
                document.getElementById('roles-heading').textContent = t('functions');
                document.getElementById('skills-heading').textContent = t('skills');
                document.getElementById('metrics-heading').textContent = t('results');
                functions.forEach(jobFunction => {
                    const item = document.createElement('div');
                    item.className = 'role-item clickable';
                    item.innerHTML = `<div class="item-name"></div><div class="item-meta"></div>`;
                    item.querySelector('.item-name').textContent = nodeLabel(jobFunction);
                    item.querySelector('.item-meta').textContent = localized(jobFunction.descriptions);
                    item.addEventListener('click', () => focusOnProfessionalNode(jobFunction.id));
                    rolesDiv.appendChild(item);
                });
                renderSkillItems(skillsDiv, skills);
                metrics.forEach(metric => {
                    const item = document.createElement('div');
                    item.className = 'metric-item clickable';
                    item.innerHTML = `<div class="metric-value"></div><div class="metric-context"></div>`;
                    item.querySelector('.metric-value').textContent = `${nodeLabel(metric)} · ${localized(metric.names)}`;
                    item.querySelector('.metric-context').textContent = localized(metric.contexts);
                    item.addEventListener('click', () => focusOnProfessionalNode(metric.id));
                    metricsDiv.appendChild(item);
                });
            } else if (node.type === 'Function') {
                const role = getNode(node.role_id);
                const skills = skillsForFunctions([node.id]);
                document.getElementById('detail-title').textContent = nodeLabel(node);
                document.getElementById('detail-type').textContent = t('function');
                document.getElementById('detail-desc').textContent = localized(node.descriptions);
                rolesSection.style.display = '';
                skillsSection.style.display = '';
                metricsSection.style.display = 'none';
                document.getElementById('roles-heading').textContent = t('role');
                document.getElementById('skills-heading').textContent = t('skills');
                const item = document.createElement('div');
                item.className = 'role-item clickable';
                item.innerHTML = `<div class="item-name"></div><div class="item-meta"></div>`;
                item.querySelector('.item-name').textContent = nodeLabel(role);
                item.querySelector('.item-meta').textContent = nodeLabel(company);
                item.addEventListener('click', () => focusOnProfessionalNode(role.id));
                rolesDiv.appendChild(item);
                renderSkillItems(skillsDiv, skills);
            } else {
                document.getElementById('detail-title').textContent = `${nodeLabel(node)} · ${localized(node.names)}`;
                document.getElementById('detail-type').textContent = t('result');
                document.getElementById('detail-desc').textContent = localized(node.contexts);
                rolesSection.style.display = '';
                skillsSection.style.display = 'none';
                metricsSection.style.display = 'none';
                document.getElementById('roles-heading').textContent = t('company');
                const item = document.createElement('div');
                item.className = 'role-item clickable';
                item.innerHTML = `<div class="item-name"></div>`;
                item.querySelector('.item-name').textContent = nodeLabel(company);
                item.addEventListener('click', () => focusOnCompany(company.id));
                rolesDiv.appendChild(item);
            }
        }

        function resetFullView(clearHistory = true) {
            if (clearHistory && !isNavigatingHistory) {
                navigationHistory = [];
                currentViewState = null;
            }
            selectedCompanyId = null;
            selectedCategory = null;
            selectedSkillId = null;
            selectedType = null;
            selectedNodeId = null;
            controls.autoRotate = true;
            controls.target.set(0, 0, 0);
            camera.position.copy(initialCamera);
            nodes3D.forEach(mesh => {
                setNodeAppearance(mesh, mesh.userData.baseOpacity, 1, false);
            });
            edges3D.forEach(line => { line.material.opacity = line.userData.baseOpacity; });
            document.getElementById('detail-panel').classList.remove('visible');
            buildCompanyFilters();
            buildLegend();
            updateBackButton();
        }

        function onClick(event) {
            if (clickTimer) window.clearTimeout(clickTimer);
            clickTimer = window.setTimeout(() => {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersection = raycaster.intersectObjects(nodes3D, false)[0];
                if (intersection?.object.userData.type === 'Company') {
                    focusOnCompany(intersection.object.userData.id);
                } else if (intersection?.object.userData.type === 'Skill') {
                    focusOnSkill(intersection.object.userData.id);
                } else if (['Role', 'Function', 'Metric'].includes(intersection?.object.userData.type)) {
                    focusOnProfessionalNode(intersection.object.userData.id);
                } else if (intersection?.object.userData.type === 'Candidate') {
                    resetFullView();
                }
            }, 220);
        }

        function onDoubleClick() {
            if (clickTimer) window.clearTimeout(clickTimer);
            resetFullView();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const now = Date.now() * 0.00045;
            nodes3D.forEach((mesh, index) => {
                mesh.position.y = mesh.userData.basePosition.y + Math.sin(now + index * 0.31) * 0.08;
            });
            edges3D.forEach(line => {
                const source = nodeMeshes.get(line.userData.source);
                const target = nodeMeshes.get(line.userData.target);
                const positions = line.geometry.attributes.position.array;
                positions[0] = source.position.x;
                positions[1] = source.position.y;
                positions[2] = source.position.z;
                positions[3] = target.position.x;
                positions[4] = target.position.y;
                positions[5] = target.position.z;
                line.geometry.attributes.position.needsUpdate = true;
            });
            controls.update();
            renderer.render(scene, camera);
        }

        function initPortfolioCounter() {
            // Keep the internal counter invisible and exclude Streamlit iframe loads.
            if (window.self !== window.top) return;
            const beacon = new Image(1, 1);
            beacon.hidden = true;
            beacon.alt = '';
            beacon.referrerPolicy = 'no-referrer';
            beacon.src = 'https://api.visitorbadge.io/api/visitors?path=https%3A%2F%2Fkeevinvieeira.github.io%2Fcurriculo-kevin%2F&label=VISUALIZA%C3%87%C3%95ES&countColor=%232563eb&labelColor=%230f172a&style=flat-square';
            document.body.appendChild(beacon);
        }

        initPortfolioCounter();
        init();
    </script>
</body>
